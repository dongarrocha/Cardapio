<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garrocha Cardápio</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

header{
background:#8B0000;
color:white;
padding:16px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:15px;
}

.categoria{
margin-bottom:35px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
display:flex;
flex-direction:column;
}

.carousel{
position:relative;
height:150px;
overflow:hidden;
}

.carousel img{
width:100%;
height:150px;
object-fit:cover;
position:absolute;
opacity:0;
transition:opacity 0.4s;
}

.carousel img.active{
opacity:1;
}

.info{
padding:10px;
}

.nome{
font-weight:bold;
}

.preco{
color:#666;
margin:6px 0;
}

.controles{
display:flex;
justify-content:space-between;
align-items:center;
}

button{
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

.btnAdd{background:#1976d2;color:white}
.btnSub{background:#999;color:white}

.carrinho{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
padding:12px;
box-shadow:0 -4px 10px rgba(0,0,0,0.2);
display:flex;
justify-content:space-between;
}

</style>

</head>

<body>

<header>
🔥 Garrocha Espetos
</header>

<div class="container">

<!-- ESPETOS -->

<div class="categoria">

<h2>🍢 Espetos</h2>

<div class="grid">

<div class="card">

<div class="carousel" id="carne">

<img src="imagens/carne1.jpg" class="active">
<img src="imagens/carne2.jpg">
<img src="imagens/carne3.jpg">

</div>

<div class="info">

<div class="nome">Espeto de Carne</div>

<div class="preco">R$21</div>

<div class="controles">

<button class="btnSub" onclick="removeItem('Carne',21)">-</button>

<span id="Carne">0</span>

<button class="btnAdd" onclick="addItem('Carne',21)">+</button>

</div>

</div>

</div>

<div class="card">

<div class="carousel" id="frango">

<img src="imagens/frango1.jpg" class="active">
<img src="imagens/frango2.jpg">

</div>

<div class="info">

<div class="nome">Espeto de Frango</div>

<div class="preco">R$19</div>

<div class="controles">

<button class="btnSub" onclick="removeItem('Frango',19)">-</button>

<span id="Frango">0</span>

<button class="btnAdd" onclick="addItem('Frango',19)">+</button>

</div>

</div>

</div>

<div class="card">
<div class="info">
<div class="nome">Coração de Frango</div>
<div class="preco">R$12</div>
<div class="controles">
<button class="btnSub" onclick="removeItem('Coração',12)">-</button>
<span id="Coração">0</span>
<button class="btnAdd" onclick="addItem('Coração',12)">+</button>
</div>
</div>
</div>

<div class="card">
<div class="info">
<div class="nome">Tri Misto</div>
<div class="preco">R$23</div>
<div class="controles">
<button class="btnSub" onclick="removeItem('Tri',23)">-</button>
<span id="Tri">0</span>
<button class="btnAdd" onclick="addItem('Tri',23)">+</button>
</div>
</div>
</div>

<div class="card">
<div class="info">
<div class="nome">Pão de Alho</div>
<div class="preco">R$6</div>
<div class="controles">
<button class="btnSub" onclick="removeItem('PaoAlho',6)">-</button>
<span id="PaoAlho">0</span>
<button class="btnAdd" onclick="addItem('PaoAlho',6)">+</button>
</div>
</div>
</div>

<div class="card">
<div class="info">
<div class="nome">Queijo</div>
<div class="preco">R$10</div>
<div class="controles">
<button class="btnSub" onclick="removeItem('Queijo',10)">-</button>
<span id="Queijo">0</span>
<button class="btnAdd" onclick="addItem('Queijo',10)">+</button>
</div>
</div>
</div>

<div class="card">
<div class="info">
<div class="nome">Milho Assado</div>
<div class="preco">R$10</div>
<div class="controles">
<button class="btnSub" onclick="removeItem('Milho',10)">-</button>
<span id="Milho">0</span>
<button class="btnAdd" onclick="addItem('Milho',10)">+</button>
</div>
</div>
</div>

<div class="card">
<div class="info">
<div class="nome">Dupla Linguiça</div>
<div class="preco">R$18</div>
<div class="controles">
<button class="btnSub" onclick="removeItem('Linguiça',18)">-</button>
<span id="Linguiça">0</span>
<button class="btnAdd" onclick="addItem('Linguiça',18)">+</button>
</div>
</div>
</div>

</div>
</div>


<!-- SUCOS -->

<div class="categoria">

<h2>🥤 Sucos</h2>

<div class="grid">

<script>

const sucos=[
"Cupuaçu","Maracujá","Graviola","Goiaba","Acerola","Laranja","Cajá"
]

sucos.forEach(suco=>{

document.write(`

<div class="card">

<div class="info">

<div class="nome">${suco}</div>

<div class="preco">R$15</div>

<div class="controles">

<button class="btnSub" onclick="removeItem('${suco}',15)">-</button>

<span id="${suco}">0</span>

<button class="btnAdd" onclick="addItem('${suco}',15)">+</button>

</div>

</div>

</div>

`)

})

</script>

</div>

</div>


<!-- COXINHAS -->

<div class="categoria">

<h2>🥟 Coxinhas</h2>

<div class="grid">

<div class="card">

<div class="carousel" id="coxcarne">

<img src="imagens/coxcarne1.jpg" class="active">
<img src="imagens/coxcarne2.jpg">

</div>

<div class="info">

<div class="nome">Carne</div>

<div class="preco">R$7</div>

<div class="controles">

<button onclick="removeItem('CoxCarne',7)">-</button>

<span id="CoxCarne">0</span>

<button onclick="addItem('CoxCarne',7)">+</button>

</div>

</div>

</div>

<div class="card">

<div class="carousel" id="coxfrango">

<img src="imagens/coxfrango1.jpg" class="active">
<img src="imagens/coxfrango2.jpg">

</div>

<div class="info">

<div class="nome">Frango</div>

<div class="preco">R$7</div>

<div class="controles">

<button onclick="removeItem('CoxFrango',7)">-</button>

<span id="CoxFrango">0</span>

<button onclick="addItem('CoxFrango',7)">+</button>

</div>

</div>

</div>

</div>

</div>

</div>


<div class="carrinho">

<div id="total">Total: R$0</div>

<button onclick="enviar()">Enviar Pedido</button>

</div>


<script>

let carrinho={}
let total=0

function addItem(nome,preco){

if(!carrinho[nome]) carrinho[nome]=0

carrinho[nome]++

document.getElementById(nome).innerText=carrinho[nome]

total+=preco

updateTotal()

}

function removeItem(nome,preco){

if(carrinho[nome]>0){

carrinho[nome]--

document.getElementById(nome).innerText=carrinho[nome]

total-=preco

updateTotal()

}

}

function updateTotal(){

document.getElementById("total").innerText="Total: R$"+total.toFixed(2)

}

function enviar(){

let msg="Pedido Garrocha:%0A"

for(let item in carrinho){

if(carrinho[item]>0){

msg+=item+" x"+carrinho[item]+"%0A"

}

}

msg+="%0ATotal: R$"+total.toFixed(2)

window.open("https://wa.me/5547991529698?text="+msg)

}


function startCarousel(id){

let box=document.getElementById(id)

if(!box) return

let imgs=box.querySelectorAll("img")

let index=0

setInterval(()=>{

imgs[index].classList.remove("active")

index=(index+1)%imgs.length

imgs[index].classList.add("active")

},2500)

}

startCarousel("carne")
startCarousel("frango")
startCarousel("coxcarne")
startCarousel("coxfrango")

</script>

</body>
</html>
