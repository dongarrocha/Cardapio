<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garrocha Espetos</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

header{
background:#8B0000;
color:white;
text-align:center;
padding:16px;
font-size:20px;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:15px;
}

.categoria{
margin-bottom:35px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{
background:white;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
overflow:hidden;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

.info{
padding:10px;
}

.nome{
font-weight:bold;
}

.preco{
color:#666;
margin:5px 0;
}

.controles{
display:flex;
justify-content:space-between;
align-items:center;
}

button{
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

.btnAdd{
background:#1976d2;
color:white;
}

.btnSub{
background:#888;
color:white;
}

.carrinho{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
padding:12px;
box-shadow:0 -4px 10px rgba(0,0,0,0.2);
display:flex;
justify-content:space-between;
align-items:center;
}

</style>

</head>

<body>

<header>
🔥 Garrocha Espetos
</header>

<div class="container">

<!-- ESPETOS -->

<div class="categoria">

<h2>🍢 Espetos</h2>

<div class="grid">

<script>

const espetos=[

["Espeto de Carne",21],
["Espeto de Frango",19],
["Coração de Frango",12],
["Tri Misto",23],
["Pão de Alho",6],
["Queijo",10],
["Milho Assado",10],
["Dupla Linguiça",18]

]

espetos.forEach(item=>{

let nome=item[0]
let preco=item[1]
let id=nome.replace(/\s/g,'')

document.write(`

<div class="card">

<img src="imagens/${id}.jpg" onerror="this.style.display='none'">

<div class="info">

<div class="nome">${nome}</div>

<div class="preco">R$${preco}</div>

<div class="controles">

<button class="btnSub" onclick="removeItem('${id}',${preco})">-</button>

<span id="${id}">0</span>

<button class="btnAdd" onclick="addItem('${id}',${preco})">+</button>

</div>

</div>

</div>

`)

})

</script>

</div>

</div>

<!-- SUCOS -->

<div class="categoria">

<h2>🥤 Sucos</h2>

<div class="grid">

<script>

const sucos=[

"Cupuaçu",
"Maracujá",
"Graviola",
"Goiaba",
"Acerola",
"Laranja",
"Cajá"

]

sucos.forEach(nome=>{

let id=nome.replace(/\s/g,'')

document.write(`

<div class="card">

<img src="imagens/${id}.jpg" onerror="this.style.display='none'">

<div class="info">

<div class="nome">${nome}</div>

<div class="preco">R$15</div>

<div class="controles">

<button class="btnSub" onclick="removeItem('${id}',15)">-</button>

<span id="${id}">0</span>

<button class="btnAdd" onclick="addItem('${id}',15)">+</button>

</div>

</div>

</div>

`)

})

</script>

</div>

</div>

<!-- COXINHAS -->

<div class="categoria">

<h2>🥟 Coxinhas</h2>

<div class="grid">

<script>

const coxinhas=[

"Calabresa e Queijo",
"Carne",
"Carne Queijo",
"Carne com Ovo",
"Pizza",
"Frango com Catupiry",
"Frango"

]

coxinhas.forEach(nome=>{

let id=nome.replace(/\s/g,'')

document.write(`

<div class="card">

<img src="imagens/${id}.jpg" onerror="this.style.display='none'">

<div class="info">

<div class="nome">${nome}</div>

<div class="preco">R$7</div>

<div class="controles">

<button class="btnSub" onclick="removeItem('${id}',7)">-</button>

<span id="${id}">0</span>

<button class="btnAdd" onclick="addItem('${id}',7)">+</button>

</div>

</div>

</div>

`)

})

</script>

</div>

</div>

</div>

<div class="carrinho">

<div id="total">Total: R$0</div>

<button onclick="enviar()">Enviar Pedido</button>

</div>

<script>

let carrinho={}
let total=0

function addItem(nome,preco){

if(!carrinho[nome]) carrinho[nome]=0

carrinho[nome]++

document.getElementById(nome).innerText=carrinho[nome]

total+=preco

updateTotal()

}

function removeItem(nome,preco){

if(carrinho[nome]>0){

carrinho[nome]--

document.getElementById(nome).innerText=carrinho[nome]

total-=preco

updateTotal()

}

}

function updateTotal(){

document.getElementById("total").innerText="Total: R$"+total.toFixed(2)

}

function enviar(){

let msg="Pedido Garrocha:%0A"

for(let item in carrinho){

if(carrinho[item]>0){

msg+=item+" x"+carrinho[item]+"%0A"

}

}

msg+="%0ATotal: R$"+total.toFixed(2)

window.open("https://wa.me/5547991529698?text="+msg)

}

</script>

</body>
</html>
