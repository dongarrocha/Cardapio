<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garrocha</title>

<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    margin:0;
}

header{
    background:#8B0000;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    margin:auto;
    padding:20px;
}

.item{
    background:white;
    display:flex;
    align-items:center;
    gap:15px;
    padding:10px;
    margin-bottom:15px;
    border-radius:10px;
}

.item img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:8px;
}

.nome{
    font-weight:bold;
}

.preco{
    color:gray;
}
</style>
</head>
<body>

<header>
    <h1>🔥 Garrocha Espetos</h1>
</header>

<div class="container">
    <div id="produtos"></div>
</div>

<script>

const produtos = [
    {
        nome:"Espeto de Carne",
        preco:21,
        imagem:"carne.jpg"
    },
    {
        nome:"Espeto de Frango",
        preco:19,
        imagem:"frango.jpg"
    },
    {
        nome:"Coração de Frango",
        preco:12,
        imagem:"coracao.jpg"
    },
    {
        nome:"Cupuaçu",
        preco:15,
        imagem:"cupuacu.jpg"
    },
    {
        nome:"Coxinha de Carne",
        preco:7,
        imagem:"coxinha.jpg"
    }
]

const container = document.getElementById("produtos")

produtos.forEach(produto=>{
    container.innerHTML += `
    
    <div class="item">
        <img src="imagens/${produto.imagem}">
        
        <div>
            <div class="nome">${produto.nome}</div>
            <div class="preco">R$ ${produto.preco}</div>
        </div>
    </div>
    
    `
})

</script>

</body>
</html>
