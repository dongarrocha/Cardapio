<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garrocha Espetos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f8f8f8;
    color:#333;
}

header{
    background:#8B0000;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    font-size:24px;
}

header p{
    font-size:14px;
    margin-top:5px;
}

.container{
    width:90%;
    max-width:900px;
    margin:20px auto;
}

.section{
    margin-bottom:30px;
}

.section h2{
    margin-bottom:15px;
    color:#8B0000;
    border-bottom:2px solid #ddd;
    padding-bottom:8px;
}

.item{
    background:white;
    display:flex;
    align-items:center;
    gap:15px;
    padding:12px;
    border-radius:10px;
    margin-bottom:12px;
    box-shadow:0 2px 5px rgba(0,0,0,0.08);
}

.item img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
}

.info{
    flex:1;
}

.nome{
    font-weight:bold;
    font-size:16px;
}

.preco{
    color:#666;
    margin-top:5px;
}

footer{
    text-align:center;
    padding:20px;
    background:white;
    margin-top:20px;
    font-size:14px;
}
</style>
</head>

<body>

<header>
    <h1>🔥 Garrocha Espetos</h1>
    <p>Cardápio para visualização</p>
</header>

<div class="container">

    <div class="section">
        <h2>🍢 Espetos</h2>
        <div id="espetos"></div>
    </div>

    <div class="section">
        <h2>🥤 Sucos</h2>
        <div id="sucos"></div>
    </div>

    <div class="section">
        <h2>🥟 Coxinhas</h2>
        <div id="coxinhas"></div>
    </div>

</div>

<footer>
    Garrocha Espetos © 2026
</footer>

<script>

const produtos = {
    espetos: [
        ["Espeto de Carne", 21],
        ["Espeto de Frango", 19],
        ["Coração de Frango", 12],
        ["Tri Misto", 23],
        ["Pão de Alho", 6],
        ["Queijo", 10],
        ["Milho Assado", 10],
        ["Dupla Linguiça", 18]
    ],

    sucos: [
        ["Cupuaçu", 15],
        ["Maracujá", 15],
        ["Graviola", 15],
        ["Goiaba", 15],
        ["Acerola", 15],
        ["Laranja", 15],
        ["Cajá", 15]
    ],

    coxinhas: [
        ["Calabresa e Queijo", 7],
        ["Carne", 7],
        ["Carne Queijo", 7],
        ["Carne com Ovo", 7],
        ["Pizza", 7],
        ["Frango com Catupiry", 7],
        ["Frango", 7]
    ]
};

function renderSection(sectionId, items){
    const container = document.getElementById(sectionId);

    items.forEach(item => {
        let nome = item[0];
        let preco = item[1];
        let id = nome.replace(/\s/g,'');

        container.innerHTML += `
            <div class="item">
                <img src="imagens/${id}.jpg" 
                     onerror="this.style.display='none'">

                <div class="info">
                    <div class="nome">${nome}</div>
                    <div class="preco">R$ ${preco}</div>
                </div>
            </div>
        `;
    });
}

renderSection("espetos", produtos.espetos);
renderSection("sucos", produtos.sucos);
renderSection("coxinhas", produtos.coxinhas);

</script>

</body>
</html>
