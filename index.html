<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garrocha Cardápio</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

header{
background:#8B0000;
color:white;
padding:15px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.container{
padding:15px;
max-width:900px;
margin:auto;
}

.categoria{
margin-bottom:30px;
}

.categoria h2{
margin-bottom:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{

background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
display:flex;
flex-direction:column;

}

.card img,
.card video{
width:100%;
height:150px;
object-fit:cover;
}

.info{
padding:10px;
}

.nome{
font-weight:bold;
}

.preco{
color:#555;
margin:5px 0;
}

button{

background:#1976d2;
border:none;
color:white;
padding:8px;
border-radius:6px;
cursor:pointer;
width:100%;

}

button:hover{
background:#125aa0;
}

.carrinho{

position:fixed;
bottom:0;
left:0;
right:0;

background:white;
padding:10px;

box-shadow:0 -4px 10px rgba(0,0,0,0.2);

display:flex;
justify-content:space-between;
align-items:center;

}

</style>

</head>

<body>

<header>
🔥 Garrocha Espetos
</header>

<div class="container">

<!-- ESPETOS -->

<div class="categoria">

<h2>🍢 Espetos</h2>

<div class="grid">

<div class="card">

<img src="imagens/carne.jpg">

<div class="info">

<div class="nome">Espeto de Carne</div>

<div class="preco">R$ 21,00</div>

<button onclick="add('Espeto de Carne',21)">Adicionar</button>

</div>

</div>


<div class="card">

<video controls>

<source src="videos/tulipa.mp4" type="video/mp4">

</video>

<div class="info">

<div class="nome">Tulipa</div>

<div class="preco">R$ 13,00</div>

<button onclick="add('Tulipa',13)">Adicionar</button>

</div>

</div>

</div>

</div>


<!-- BEBIDAS -->

<div class="categoria">

<h2>🥤 Bebidas</h2>

<div class="grid">

<div class="card">

<img src="imagens/coca.jpg">

<div class="info">

<div class="nome">Coca Cola Lata</div>

<div class="preco">R$ 7,00</div>

<button onclick="add('Coca Lata',7)">Adicionar</button>

</div>

</div>

</div>

</div>

</div>


<!-- CARRINHO -->

<div class="carrinho">

<div id="total">Total: R$ 0,00</div>

<button onclick="whats()">Enviar Pedido</button>

</div>


<script>

let carrinho=[]
let total=0

function add(nome,preco){

carrinho.push(nome)

total+=preco

document.getElementById("total").innerHTML="Total: R$ "+total.toFixed(2)

}

function whats(){

let msg="Pedido Garrocha:%0A"

carrinho.forEach(item=>{
msg+=item+"%0A"
})

msg+="%0ATotal: R$ "+total.toFixed(2)

window.open("https://wa.me/5547991529698?text="+msg)

}

</script>

</body>
</html>
